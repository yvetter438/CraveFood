<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crave · @jalalsamfit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="feed-page">
    <div class="feed-app">
      <header class="feed-top">
        <div class="feed-brand">
          <a href="index.html" class="logo logo-link">Crave</a>
        </div>
        <a
          class="btn-marketing btn-marketing--primary btn-waitlist-sm js-waitlist-cta"
          data-cta-location="feed_header"
          href="https://forms.gle/Ut8bRDfcMP9fZYTN6"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Join the waitlist"
          ><span class="waitlist-cta__long">Join the waitlist</span
          ><span class="waitlist-cta__short" aria-hidden="true">Waitlist</span></a
        >
      </header>

      <section class="feed-profile" aria-label="Creator profile">
        <div class="feed-avatar" aria-hidden="true">
          <span class="feed-avatar-inner">J</span>
        </div>
        <div class="feed-profile-text">
          <h1 class="feed-handle">@jalalsamfit</h1>
          <p class="feed-bio">Recipe videos · shop ingredients from each post</p>
        </div>
      </section>

      <nav class="feed-tabs" aria-label="Content">
        <span class="feed-tab is-active" aria-current="page">Posts</span>
      </nav>

      <ul class="feed-grid" id="feedGrid" aria-label="Recipe posts"></ul>
    </div>

    <script src="config.js"></script>
    <script>
      window.CRAVE_FEED_CREATOR_ID = "jalalsamfit";
    </script>
    <script src="posts-config.js"></script>
    <script src="feed.js"></script>
    <script src="analytics-config.js"></script>
    <script src="gtag.js"></script>
    <script src="analytics.js"></script>
    <script src="waitlist-cta.js"></script>
  </body>
</html>
